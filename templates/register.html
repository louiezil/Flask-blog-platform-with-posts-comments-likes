{% extends 'base.html' %} {% block title %} Register {% endblock title %} {%
block content %}
<form class="register_form" method="post">
  <div class="input_form">
    <input
      type="text"
      name="username"
      required
      minlength="4"
      placeholder="Enter username"
    />
  </div>
  <div class="input_form">
    <input
      type="email"
      name="email"
      required
      minlength="9"
      placeholder="Enter email"
    />
  </div>
  <div class="input_form">
    <input
      type="password"
      name="password"
      required
      minlength="6"
      placeholder="Enter password"
    />
  </div>

  {% if error %}
  <div class="error">{{error}}</div>
  {% endif %}

  <button class="btm" type="submit">Register</button>
</form>
{% endblock content %}
